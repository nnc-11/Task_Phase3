<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc Mandate 12 - Audit Anti-Defeat</title>
  <desc id="desc">Sơ đồ hai giai đoạn gồm Audit Foundation nâng cấp từ Mandate 11 và IAM Hardening trong một tài khoản AWS.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f2039"/>
    </linearGradient>
    <linearGradient id="foundation" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2f48"/>
      <stop offset="1" stop-color="#0b263d"/>
    </linearGradient>
    <linearGradient id="iam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#251f49"/>
      <stop offset="1" stop-color="#182542"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#55c2ff"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffbd66"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#b99cff"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #a9bdd3; }
      .phase { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #ffffff; letter-spacing: .4px; }
      .phase-note { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #b7ccdf; }
      .node-title { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #f7fbff; }
      .node-text { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #c8d7e7; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #aebfd0; }
      .pill { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #081522; }
      .edge { fill: none; stroke: #55c2ff; stroke-width: 3; marker-end: url(#arrowBlue); }
      .edge-dashed { fill: none; stroke: #ffbd66; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowAmber); }
      .edge-iam { fill: none; stroke: #b99cff; stroke-width: 3; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="url(#page)"/>
  <circle cx="1460" cy="90" r="180" fill="#143d5d" opacity="0.20"/>
  <circle cx="115" cy="1035" r="230" fill="#2b235c" opacity="0.18"/>

  <text x="70" y="62" class="title">MANDATE 12 · AUDIT ANTI-DEFEAT</text>
  <text x="70" y="91" class="subtitle">Single AWS account · Nâng cấp in-place nền Mandate 11 · Foundation trước, IAM hardening sau</text>
  <rect x="1320" y="38" width="210" height="40" rx="20" fill="#90e0b5"/>
  <text x="1425" y="63" text-anchor="middle" class="pill">TARGET ARCHITECTURE</text>

  <!-- Phase 1 container -->
  <rect x="45" y="125" width="1510" height="635" rx="24" fill="url(#foundation)" stroke="#2c6d91" stroke-width="2"/>
  <rect x="67" y="145" width="330" height="42" rx="21" fill="#1676a3"/>
  <text x="232" y="172" text-anchor="middle" class="phase">1 · AUDIT FOUNDATION</text>
  <text x="420" y="171" class="phase-note">Tái sử dụng CloudTrail, bucket và alert plane M11 — không tạo trail thứ hai</text>

  <!-- Sources -->
  <rect x="80" y="225" width="245" height="105" rx="16" fill="#102b42" stroke="#4f93b7" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="112" cy="257" r="14" fill="#55c2ff"/>
  <path d="M105 257h14M112 250v14" stroke="#07111f" stroke-width="3"/>
  <text x="140" y="259" class="node-title">AWS Management API</text>
  <text x="105" y="289" class="node-text">Management read/write events</text>
  <text x="105" y="310" class="small">Gồm Secrets Manager access metadata</text>

  <rect x="80" y="365" width="245" height="105" rx="16" fill="#102b42" stroke="#4f93b7" stroke-width="2" filter="url(#shadow)"/>
  <path d="M100 391h25v22h-25z M105 385h15v6" fill="none" stroke="#55c2ff" stroke-width="3"/>
  <text x="140" y="402" class="node-title">S3 phạm vi được duyệt</text>
  <text x="105" y="432" class="node-text">Object-level data events</text>
  <text x="105" y="453" class="small">Exact bucket/prefix ARN · không gồm audit bucket</text>

  <rect x="80" y="505" width="245" height="105" rx="16" fill="#102b42" stroke="#4f93b7" stroke-width="2" filter="url(#shadow)"/>
  <polygon points="112,530 128,539 128,557 112,566 96,557 96,539" fill="none" stroke="#55c2ff" stroke-width="3"/>
  <text x="140" y="542" class="node-title">EKS audit logs</text>
  <text x="105" y="572" class="node-text">api · audit · authenticator</text>
  <text x="105" y="593" class="small">Bằng chứng bổ sung · heartbeat giám sát</text>

  <!-- CloudTrail -->
  <rect x="405" y="300" width="285" height="185" rx="18" fill="#123752" stroke="#55c2ff" stroke-width="3" filter="url(#shadow)"/>
  <path d="M435 340c0-15 13-27 29-27 13 0 24 8 28 19 3-2 7-3 11-3 13 0 24 10 24 23s-11 23-24 23h-66c-13 0-24-10-24-23 0-10 7-19 17-22" fill="none" stroke="#70d0ff" stroke-width="3"/>
  <text x="548" y="350" text-anchor="middle" class="node-title">M11 CloudTrail nâng cấp</text>
  <text x="430" y="393" class="node-text">• Multi-region · IsLogging=true</text>
  <text x="430" y="416" class="node-text">• Management + approved S3 Data</text>
  <text x="430" y="439" class="node-text">• Log file integrity validation</text>
  <text x="430" y="462" class="small">Một source of truth · giữ nguyên ARN/name</text>

  <!-- Archive -->
  <rect x="775" y="215" width="300" height="175" rx="18" fill="#123b43" stroke="#65d3bd" stroke-width="3" filter="url(#shadow)"/>
  <ellipse cx="814" cy="252" rx="22" ry="10" fill="none" stroke="#65d3bd" stroke-width="3"/>
  <path d="M792 252v35c0 6 10 10 22 10s22-4 22-10v-35 M792 269c0 6 10 10 22 10s22-4 22-10" fill="none" stroke="#65d3bd" stroke-width="3"/>
  <text x="850" y="252" class="node-title">S3 audit archive hiện hữu</text>
  <text x="800" y="316" class="node-text">Object mới: COMPLIANCE 365 ngày</text>
  <text x="800" y="339" class="node-text">Lifecycle: 400 ngày · Versioning · SSE-S3</text>
  <text x="800" y="362" class="small">Log file + signed digest chain</text>

  <!-- Detection -->
  <rect x="775" y="430" width="300" height="180" rx="18" fill="#3a2d1e" stroke="#ffbd66" stroke-width="3" filter="url(#shadow)"/>
  <path d="M801 466h28M815 452v28" stroke="#ffbd66" stroke-width="3"/>
  <text x="850" y="471" class="node-title">Tamper detection &amp; routing</text>
  <text x="800" y="510" class="node-text">EventBridge M11 + nhóm g7/g8</text>
  <text x="800" y="533" class="node-text">Hardened Lambda alert router</text>
  <text x="800" y="556" class="node-text">Critical groups 1/2/3/4/7/8 luôn alert</text>
  <text x="800" y="579" class="small">Automation allowlist không được suppress</text>

  <!-- Alert plane -->
  <rect x="1160" y="230" width="335" height="120" rx="18" fill="#3a2d1e" stroke="#ffbd66" stroke-width="3" filter="url(#shadow)"/>
  <path d="M1190 266h30v22h-30z M1190 266l15 12 15-12" fill="none" stroke="#ffbd66" stroke-width="3"/>
  <text x="1235" y="272" class="node-title">Primary + Global SNS</text>
  <text x="1185" y="310" class="node-text">Security recipients đã Confirmed</text>
  <text x="1185" y="331" class="small">Alert mang actor · session · action · resource</text>

  <rect x="1160" y="390" width="335" height="100" rx="18" fill="#3a2d1e" stroke="#ffbd66" stroke-width="3" filter="url(#shadow)"/>
  <path d="M1190 421h30v22h-30z M1190 421l15 12 15-12" fill="none" stroke="#ffbd66" stroke-width="3"/>
  <text x="1235" y="427" class="node-title">Heartbeat fallback SNS</text>
  <text x="1185" y="462" class="small">Cùng region · chỉ cho Missing/Errors alarms</text>

  <!-- Heartbeat -->
  <rect x="1120" y="535" width="375" height="165" rx="18" fill="#16334b" stroke="#55c2ff" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="1165" cy="581" r="22" fill="none" stroke="#55c2ff" stroke-width="3"/>
  <path d="M1165 568v14l10 7" fill="none" stroke="#55c2ff" stroke-width="3"/>
  <text x="1205" y="580" class="node-title">Heartbeat mỗi 5 phút</text>
  <text x="1148" y="620" class="node-text">Trail/delivery/digest/selectors · bucket/lock</text>
  <text x="1148" y="643" class="node-text">rules/targets/router/alarms/topics · EKS audit</text>
  <text x="1148" y="672" class="small">PASS hoặc publish lỗi độc lập; Missing/Errors → alarm</text>

  <!-- Foundation edges -->
  <path d="M325 277 C360 277 365 345 405 345" class="edge"/>
  <path d="M325 417 C360 417 370 402 405 402" class="edge"/>
  <path d="M690 350 C730 350 735 303 775 303" class="edge"/>
  <path d="M690 430 C735 430 735 520 775 520" class="edge"/>
  <path d="M1075 520 C1110 520 1120 290 1160 290" class="edge-dashed"/>
  <path d="M1075 520 C1110 520 1120 440 1160 440" class="edge-dashed"/>
  <path d="M1120 590 C1088 590 1090 350 1075 350" class="edge"/>
  <path d="M1120 620 C1085 620 1090 570 1075 570" class="edge"/>
  <path d="M1120 650 C880 720 470 690 325 558" class="edge"/>
  <path d="M1305 535 C1305 510 1305 490 1305 490" class="edge-dashed"/>
  <path d="M1390 535 C1450 515 1460 365 1390 350" class="edge-dashed"/>

  <!-- Phase 2 container -->
  <rect x="45" y="790" width="1510" height="230" rx="24" fill="url(#iam)" stroke="#6856a6" stroke-width="2"/>
  <rect x="67" y="810" width="310" height="42" rx="21" fill="#6d55b8"/>
  <text x="222" y="837" text-anchor="middle" class="phase">2 · IAM HARDENING</text>
  <text x="400" y="836" class="phase-note">Change riêng sau khi Foundation healthy · rollout từng identity theo đúng Terraform owner</text>

  <rect x="85" y="880" width="270" height="100" rx="16" fill="#28234b" stroke="#b99cff" stroke-width="2"/>
  <text x="220" y="915" text-anchor="middle" class="node-title">Daily Operator</text>
  <text x="220" y="941" text-anchor="middle" class="node-text">Least privilege · MFA</text>
  <text x="220" y="962" text-anchor="middle" class="small">Không được sửa audit foundation</text>

  <rect x="430" y="880" width="270" height="100" rx="16" fill="#28234b" stroke="#b99cff" stroke-width="2"/>
  <text x="565" y="915" text-anchor="middle" class="node-title">Terraform Apply Role</text>
  <text x="565" y="941" text-anchor="middle" class="node-text">Tailored allow + boundary</text>
  <text x="565" y="962" text-anchor="middle" class="small">Không tự mở rộng đặc quyền</text>

  <rect x="805" y="875" width="320" height="110" rx="16" fill="#30284f" stroke="#d4c7ff" stroke-width="2"/>
  <text x="965" y="911" text-anchor="middle" class="node-title">M12 Permissions Boundary</text>
  <text x="965" y="938" text-anchor="middle" class="node-text">Deny audit/IAM/OIDC tamper</text>
  <text x="965" y="960" text-anchor="middle" class="small">Bắt buộc cho role/user mới thuộc scope</text>

  <rect x="1195" y="875" width="310" height="110" rx="16" fill="#33283a" stroke="#ef9db4" stroke-width="2"/>
  <text x="1350" y="911" text-anchor="middle" class="node-title">Audit admin / Break-glass</text>
  <text x="1350" y="938" text-anchor="middle" class="node-text">Named owner · MFA · incident-only</text>
  <text x="1350" y="960" text-anchor="middle" class="small">Root vẫn là residual risk được ký nhận</text>

  <path d="M220 980 V1000 H965 V985" class="edge-iam"/>
  <path d="M700 930 H805" class="edge-iam"/>
  <path d="M1125 930 H1195" fill="none" stroke="#ef9db4" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M1152 920 L1172 940 M1172 920 L1152 940" stroke="#ef9db4" stroke-width="4"/>
  <text x="1160" y="908" text-anchor="middle" class="small">DENY ASSUME</text>

  <!-- Footer -->
  <text x="70" y="1056" class="small">Nguồn thiết kế: m12-solution-v2.3 · m12-plan-v2.3 · trạng thái tài liệu: HANDOFF READY / NOT APPROVED FOR APPLY</text>
  <text x="1530" y="1056" text-anchor="end" class="small">v1.0 · 22/07/2026</text>
</svg>
